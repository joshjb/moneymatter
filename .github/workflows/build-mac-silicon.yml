name: Build macOS Apple Silicon Desktop App

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish as GitHub Release asset'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions: write-all

jobs:
  build-mac-arm64:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-14 # Native Apple Silicon M-series runner on GitHub Actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock', 'packages/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Moneymatter Frontend & Desktop Assets
        run: |
          npm -w packages/frontend run build
          node packages/desktop/scripts/build-frontend.mjs

      - name: Build Tauri Desktop App for Apple Silicon (aarch64-apple-darwin)
        run: |
          cd packages/desktop
          npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Compress .app Bundle
        run: |
          cd packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          tar -czf MoneyMatter-mac-arm64.app.tar.gz MoneyMatter.app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMatter-mac-arm64
          path: |
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/MoneyMatter-mac-arm64.app.tar.gz

      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/MoneyMatter-mac-arm64.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
